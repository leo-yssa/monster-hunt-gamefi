version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - MONSTER_GAME_RPC=${MONSTER_GAME_RPC}
      - MONSTER_GAME_CONTRACT=${MONSTER_GAME_CONTRACT}
      - MONSTER_GAME_PRIVKEY=${MONSTER_GAME_PRIVKEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    env_file:
      - .env
    environment:
      - MONSTER_GAME_RPC=${MONSTER_GAME_RPC}
      - MONSTER_GAME_CONTRACT=${MONSTER_GAME_CONTRACT}
      - MONSTER_GAME_PRIVKEY=${MONSTER_GAME_PRIVKEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres

  confirmation_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/confirmation_worker"]
    env_file:
      - .env
    depends_on:
      - postgres
      - api

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monster_gamefi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: 